<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">How Tarot Pixel works</title>
  <desc id="desc">Sync designs to local visual context. A coding agent queries it through MCP to implement, compare, and refine within your project.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101222"/><stop offset="1" stop-color="#211c3e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bda8ff"/><stop offset="1" stop-color="#7ee3d0"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a99ae1"/></marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#background)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <image x="44" y="33" width="44" height="44" href="data:image/png;base64,"/>
    <text x="100" y="64" fill="#f5f3ff" font-size="24" font-weight="650">Tarot Pixel</text>
    <text x="1152" y="62" text-anchor="end" fill="#b6aecf" font-size="16">Workflow overview</text>
    <text x="48" y="116" fill="#eeeaf9" font-size="28" font-weight="600">Visual context on demand. Room to iterate.</text>
    <rect x="48" y="160" width="290" height="150" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#5e5778"/>
    <text x="72" y="196" fill="#b8b0cf" font-size="15">01 / SYNC DESIGN</text>
    <text x="72" y="234" fill="#f5f3ff" font-size="25" font-weight="600">Figma · Sketch</text>
    <text x="72" y="275" fill="#b8b0cf" font-size="15">Frames, artboards &amp; layers</text>
    <rect x="455" y="160" width="290" height="150" rx="16" fill="#bda8ff" fill-opacity="0.11" stroke="url(#accent)"/>
    <text x="479" y="196" fill="#cfbfff" font-size="15">02 / LOCAL VISUAL CONTEXT</text>
    <text x="479" y="234" fill="#ffffff" font-size="25" font-weight="650">Tarot Pixel</text>
    <text x="479" y="275" fill="#d4cce8" font-size="15">Layout · Styles · Layers · Assets</text>
    <rect x="862" y="160" width="290" height="150" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#5e5778"/>
    <text x="886" y="196" fill="#b8b0cf" font-size="15">03 / BUILD IN YOUR PROJECT</text>
    <text x="886" y="234" fill="#f5f3ff" font-size="25" font-weight="600">Coding Agent</text>
    <text x="886" y="275" fill="#b8b0cf" font-size="15">Components · State · Conventions</text>
    <path d="M 350 237 H 437" stroke="#a99ae1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="395" y="218" text-anchor="middle" fill="#b8b0cf" font-size="14">Sync</text>
    <path d="M 757 237 H 844" stroke="#a99ae1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="802" y="218" text-anchor="middle" fill="#b8b0cf" font-size="14">MCP</text>
    <path d="M 1007 324 V 365 H 600 V 327" fill="none" stroke="#7ee3d0" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow)"/>
    <rect x="662" y="350" width="290" height="30" rx="15" fill="#211c3e"/>
    <text x="807" y="371" text-anchor="middle" fill="#9be4d5" font-size="16">Implement → Compare → Refine</text>
    <text x="48" y="380" fill="#b8b0cf" font-size="16">Design data stays available as you build.</text>
  </g>
</svg>
